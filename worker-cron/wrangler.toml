# Worker de agendamento do Portal ROTA (implantação: npx wrangler deploy, dentro desta pasta).
# Segredo: npx wrangler secret put ROTA_CRON_SECRET (o mesmo valor configurado no Pages).
name = "rota-agendador"
main = "index.js"
compatibility_date = "2024-11-01"

[vars]
SITE_URL = "https://rotalegacyroleplay.pages.dev"

[triggers]
crons = ["*/10 * * * *"]
